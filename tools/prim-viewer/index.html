<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prim-viewer</title>
  <style>
    html, body { margin: 0; background: #f4f3ef; color: #111; font: 16px/1.4 "Instrument Sans", system-ui, sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 18px 48px; }
    h1 { font-weight: 500; letter-spacing: -0.04em; }
    .kicker { color: #6a6a66; font: 12px/1.3 ui-monospace, monospace; }
    showprim { display: block; margin-top: 22px; min-height: 360px; }
    code { font: 13px/1.3 ui-monospace, monospace; }
  </style>
  <script type="module" src="./showprim.js"></script>
</head>
<body>
  <main>
    <p class="kicker">prim-viewer · surface / talk · cites *</p>
    <h1>Drop a .prim</h1>
    <p>Same idea as Flash. The file is the thing. This tag is how you see it.</p>
    <p><code><showprim filename="yadda.prim"></code></p>
    <showprim></showprim>
  </main>
</body>
</html>
